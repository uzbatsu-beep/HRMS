let state=load();let currentPage='overview';let configTab='organization';let pageSearch='';
function load(){try{const x=localStorage.getItem(STORAGE);return x?JSON.parse(x):seed()}catch(e){return seed()}}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){window.__twmMemory=JSON.stringify(state)}}
function uid(prefix='id'){return prefix+'_'+Math.random().toString(36).slice(2,9)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function unitName(id){return state.org.find(x=>x.id===id)?.name||'Не назначено'}
function person(id){return state.employees.find(x=>x.id===id)}
function skill(id){return state.skills.find(x=>x.id===id)}
function credentialType(id){return state.credentialTypes.find(x=>x.id===id)}
function initials(name){return String(name||'').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function badge(text,kind='neutral'){return `<span class="badge ${kind}">${esc(text)}</span>`}
function getDocStatus(doc){if(doc.status==='Просрочен')return 'danger';if(doc.status==='Истекает')return 'warning';let d=doc.expires?Math.ceil((new Date(doc.expires+'T00:00:00')-new Date())/86400000):9999;if(d<0)return 'danger';if(d<=30)return 'warning';return 'success'}
function docStatusText(doc){const k=getDocStatus(doc);return k==='danger'?'Просрочен':k==='warning'?'Истекает':'Действует'}
function setPage(page){if(state.modules[page]===false&&page!=='config'){toast('Модуль отключён в конфигураторе');return}currentPage=page;document.querySelectorAll('.nav-btn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('crumbText').textContent=({overview:'Обзор',personnel:'Персонал',matrix:'Компетенции',credentials:'Допуски и документы',planning:'Планирование',workorders:'Технические задания',analytics:'Аналитика',config:'Конфигуратор'})[page]||page;pageSearch='';render()}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2600)}
function pageHead(kicker,title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div><div class="head-actions">${actions}</div></div>`}
function stat(label,value,foot,icon){return `<div class="stat-card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function render(){const c=document.getElementById('pageContent');const pages={overview:renderOverview,personnel:renderPersonnel,matrix:renderMatrix,credentials:renderCredentials,planning:renderPlanning,workorders:renderWorkorders,analytics:renderAnalytics,config:renderConfig};c.innerHTML=(pages[currentPage]||renderOverview)();}
function renderOverview(){const active=state.employees.filter(p=>p.status==='Активен').length;const open=state.workOrders.filter(w=>!['Закрыто','Отменено'].includes(w.status)).length;const expired=state.credentials.filter(d=>getDocStatus(d)==='danger').length;const pending=state.workOrders.filter(w=>w.status==='Открыто').length;const top=state.org.slice(1).map(u=>({name:u.name,count:state.employees.filter(p=>p.unit===u.id).length})).filter(x=>x.count).sort((a,b)=>b.count-a.count);return `${pageHead('ОПЕРАЦИОННЫЙ ОБЗОР','Техническая служба','Сводная картина по персоналу, компетенциям, допускам и текущим техническим заданиям.',`<button class="btn" data-action="export">⇩ Экспорт данных</button><button class="btn btn-primary" data-action="new-work">＋ Новое задание</button>`)}<div class="grid stats">${stat('Активные специалисты',active,'В кадровом контуре','♙')}${stat('Открытые задания',open,`${pending} требуют назначения`,'⚙')}${stat('Просроченные допуски',expired,expired?'Требуют внимания':'Нет критических нарушений','!')}${stat('Компетенции в каталоге',state.skills.length,'Настраиваемый справочник','▤')}</div><div class="grid overview-grid"><section class="panel"><div class="panel-head"><h2>Текущие технические задания</h2><button class="link-btn" data-page="workorders">Все задания →</button></div><div class="work-list">${state.workOrders.filter(w=>!['Закрыто','Отменено'].includes(w.status)).slice(0,4).map(workCard).join('')||'<div class="empty">Нет активных заданий</div>'}</div></section><section class="panel"><div class="panel-head"><h2>Сигналы и риски</h2><small>Обновлено сейчас</small></div><div class="alert-list">${expired?`<div class="alert-item"><div class="alert-mark danger">!</div><div><strong>Просроченный допуск</strong><p>${state.credentials.filter(d=>getDocStatus(d)==='danger').map(d=>`${person(d.personId)?.name||'Сотрудник'} · ${credentialType(d.typeId)?.name||'Документ'}`).join('<br>')}</p></div></div>`:''}${state.credentials.filter(d=>getDocStatus(d)==='warning').length?`<div class="alert-item"><div class="alert-mark">◷</div><div><strong>Скоро истекает срок</strong><p>${state.credentials.filter(d=>getDocStatus(d)==='warning').length} документа требуют продления или проверки.</p></div></div>`:''}<div class="alert-item"><div class="alert-mark">⌖</div><div><strong>Риск зависимости от экспертов</strong><p>Проверьте покрытие критических компетенций в матрице навыков.</p></div></div><div class="alert-item"><div class="alert-mark">↗</div><div><strong>${pending} задания без исполнителя</strong><p>Откройте подбор кандидатов и проверьте доступность специалистов.</p></div></div></div></section></div><div class="grid two-col" style="margin-top:16px"><section class="panel"><div class="panel-head"><h2>Распределение персонала</h2><small>По подразделениям</small></div><div class="mini-bars">${top.map(x=>`<div class="bar-row"><span>${esc(x.name)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(7,x.count/Math.max(1,active)*100)}%"></div></div><span class="bar-value">${x.count}</span></div>`).join('')||'<div class="empty">Нет данных</div>'}</div></section><section class="panel"><div class="panel-head"><h2>Быстрые действия</h2><small>Администрирование</small></div><div class="grid" style="grid-template-columns:1fr 1fr;gap:8px"><button class="btn" data-page="personnel">＋ Добавить сотрудника</button><button class="btn" data-page="matrix">▤ Матрица навыков</button><button class="btn" data-page="config">⚙ Настроить систему</button><button class="btn" data-action="export">⇩ Резервная копия</button></div><p class="footer-note">Демонстрационные данные. Все изменения сохраняются в локальном хранилище текущего браузера.</p></section></div>`}
function workCard(w){const p=person(w.assignedTo);return `<article class="work-card"><div class="work-card-head"><div><div class="work-title">${esc(w.number)} · ${esc(w.title)}</div><div class="work-meta"><span>⌖ ${esc(w.equipment||'Оборудование не указано')}</span><span>◷ ${esc(w.due||'Без срока')}</span><span>${w.estimate||0} ч</span></div></div><div>${badge(w.priority,w.priority==='Высокий'?'danger':w.priority==='Средний'?'warning':'neutral')}</div></div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div class="req-list">${(w.skills||[]).map(r=>`<span class="req">${esc(skill(r.skillId)?.name||'Навык')} ≥ ${r.min}</span>`).join('')}${(w.credentials||[]).map(r=>`<span class="req">${esc(credentialType(r.typeId)?.name||'Допуск')}</span>`).join('')}</div><div style="display:flex;align-items:center;gap:8px">${badge(w.status,w.status==='В работе'?'info':w.status==='Назначено'?'success':'warning')}<button class="btn btn-sm" data-action="work-detail" data-id="${w.id}">Открыть →</button></div></div><div class="work-meta">Исполнитель: <strong style="color:var(--text)">${p?esc(p.name):'Не назначен'}</strong></div></article>`}
function renderPersonnel(){const q=pageSearch.toLowerCase();const rows=state.employees.filter(p=>[p.name,p.position,unitName(p.unit)].join(' ').toLowerCase().includes(q));return `${pageHead('РЕСУРСНЫЙ СОСТАВ','Персонал технической службы','Единый профиль специалиста: должность, организационная принадлежность, навыки, доступность и квалификационные документы.',`<button class="btn" data-action="export-csv">⇩ CSV</button><button class="btn btn-primary" data-action="new-person">＋ Добавить сотрудника</button>`)}<div class="toolbar"><div class="toolbar-left"><input class="control" id="pageSearch" value="${esc(pageSearch)}" placeholder="Поиск сотрудника…"><select class="select" id="unitFilter"><option value="">Все подразделения</option>${state.org.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div><div class="toolbar-right"><span class="muted" style="font-size:10px">Записей: ${rows.length}</span></div></div><div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Сотрудник</th><th>Должность</th><th>Подразделение</th><th>Компетенции</th><th>Смена</th><th>Доступность</th><th>Статус</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr data-person-row="${p.id}"><td><div class="person-cell"><div class="avatar">${initials(p.name)}</div><div><div class="person-name">${esc(p.name)}</div><div class="person-sub">${esc(p.email||'Контакт не указан')}</div></div></div></td><td>${esc(p.position)}</td><td>${esc(unitName(p.unit))}</td><td>${Object.keys(p.skills||{}).length} навыков</td><td>${esc(p.shift||'—')}</td><td>${badge(p.availability,p.availability==='Доступен'?'success':p.availability==='Занят'?'warning':'neutral')}</td><td>${badge(p.status,p.status==='Активен'?'success':'neutral')}</td><td><button class="btn btn-sm" data-action="edit-person" data-id="${p.id}">Открыть</button></td></tr>`).join('')||`<tr><td colspan="8"><div class="empty">Сотрудники не найдены</div></td></tr>`}</tbody></table></div></div>`}
function renderMatrix(){const people=state.employees.filter(p=>p.status==='Активен');return `${pageHead('РАЗВИТИЕ КОМПЕТЕНЦИЙ','Матрица компетенций','Настраиваемые категории навыков и шкалы оценки. Самооценка, подтверждённый уровень и история аттестации должны различаться.',`<button class="btn" data-action="matrix-export">⇩ Экспорт матрицы</button><button class="btn btn-primary" data-page="config">⚙ Настроить компетенции</button>`)}<div class="toolbar"><div class="toolbar-left"><input class="control" id="matrixSearch" placeholder="Фильтр сотрудников или навыков…"><select class="select" id="categoryFilter"><option value="">Все категории</option>${[...new Set(state.skills.map(s=>s.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="toolbar-right"><span class="muted" style="font-size:10px">Утверждённые уровни · шкала 0–4 (демо)</span></div></div><div class="table-card"><div class="table-wrap"><table class="data-table matrix" id="matrixTable"><thead><tr><th>Специалист</th>${state.skills.map(s=>`<th title="${esc(s.category)}">${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${people.map(p=>`<tr><td><div class="person-cell"><div class="avatar">${initials(p.name)}</div><div><div class="person-name">${esc(p.name)}</div><div class="person-sub">${esc(p.position)}</div></div></div></td>${state.skills.map(s=>{const n=p.skills?.[s.id];return `<td>${n===undefined?'<span class="level na">—</span>':`<span class="level l${Math.min(4,Math.max(0,n))}">${n}</span>`}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></div><div class="matrix-legend">${[0,1,2,3,4].map(n=>`<span class="legend-item"><span class="level l${n}" style="width:18px;height:18px">${n}</span>${['Нет данных','Базовый','Самостоятельный','Продвинутый','Эксперт'][n]}</span>`).join('')}<span class="legend-item"><span class="level na" style="width:18px;height:18px">—</span>Не оценено</span></div><p class="footer-note">В прототипе отображается одно действующее значение навыка. В целевой системе оценка должна иметь автора, дату, метод, статус утверждения и историю изменений.</p>`}
function renderCredentials(){const docs=state.credentials.map(d=>({...d,p:person(d.personId),t:credentialType(d.typeId)}));return `${pageHead('КВАЛИФИКАЦИИ И БЕЗОПАСНОСТЬ','Допуски и документы','Разделяйте практический навык, формальную квалификацию, сертификат и разрешение на выполнение конкретных видов работ.',`<button class="btn btn-primary" data-action="new-credential">＋ Добавить документ</button>`)}<div class="grid stats">${stat('Всего документов',docs.length,'В реестре','▣')}${stat('Действуют',docs.filter(d=>getDocStatus(d)==='success').length,'Срок не истёк','✓')}${stat('Истекают',docs.filter(d=>getDocStatus(d)==='warning').length,'Требуют проверки','◷')}${stat('Просрочены',docs.filter(d=>getDocStatus(d)==='danger').length,'Проверьте назначенные работы','!')}</div><div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Сотрудник</th><th>Тип документа</th><th>Номер</th><th>Выдан</th><th>Действует до</th><th>Организация</th><th>Статус</th><th></th></tr></thead><tbody>${docs.map(d=>`<tr><td><div class="person-name">${esc(d.p?.name||'Неизвестен')}</div></td><td>${esc(d.t?.name||'Неизвестный тип')}</td><td>${esc(d.number)}</td><td>${esc(d.issued||'—')}</td><td>${esc(d.expires||'Бессрочно')}</td><td>${esc(d.issuer||'—')}</td><td>${badge(docStatusText(d),getDocStatus(d))}</td><td><button class="tiny-action" data-action="edit-credential" data-id="${d.id}">Изменить</button></td></tr>`).join('')||'<tr><td colspan="8"><div class="empty">Документы отсутствуют</div></td></tr>'}</tbody></table></div></div><p class="footer-note">Статусы рассчитываются по сроку действия. В реальной системе дополнительно необходимы проверка подлинности, журнал продления, вложения и правила применимости документа к конкретному виду работ.</p>`}
function renderPlanning(){const people=state.employees.filter(p=>p.status==='Активен');const total=Number(state.settings.capacityHours)||8;return `${pageHead('ПЛАНИРОВАНИЕ РЕСУРСОВ','Доступность и загрузка','Предварительное представление загрузки технического персонала. В рабочей версии интервалы должны рассчитываться из смен, отсутствий и назначений.',`<button class="btn" data-action="new-absence">＋ Отметить отсутствие</button><button class="btn btn-primary" data-page="workorders">Распределить задания →</button>`)}<div class="panel"><div class="panel-head"><h2>Загрузка специалистов</h2><small>Демонстрационная смена · ${total} ч доступной мощности</small></div><div class="schedule-grid">${people.map(p=>{const assigned=state.workOrders.filter(w=>w.assignedTo===p.id&&!['Закрыто','Отменено'].includes(w.status)).reduce((a,w)=>a+(Number(w.estimate)||0),0);const pct=Math.min(100,Math.round(assigned/total*100));return `<div class="resource-row"><div><div class="resource-name">${esc(p.name)}</div><div class="resource-role">${esc(p.position)}</div></div><div><div class="load-track"><div class="load-seg ${pct>85?'warn':''}" style="width:${pct}%"></div></div><div class="muted" style="font-size:9px;margin-top:4px">${assigned} ч назначено · ${Math.max(0,total-assigned)} ч свободно</div></div><div class="load-num">${pct}%</div></div>`}).join('')}</div></div><div class="grid two-col" style="margin-top:16px"><section class="panel"><div class="panel-head"><h2>Статусы доступности</h2></div><div class="alert-list">${['Доступен','Занят','Отсутствует'].map(v=>`<div class="alert-item"><div class="alert-mark">${v==='Доступен'?'✓':v==='Занят'?'◷':'—'}</div><div><strong>${v}</strong><p>${people.filter(p=>p.availability===v).length} специалистов</p></div></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><h2>Текущие ограничения</h2></div><p class="footer-note">Этот экран пока использует укрупнённую оценку в часах. Не считать его полноценным календарным планировщиком: отсутствуют пересечения временных интервалов, сменные шаблоны, часовые пояса, отпуска и календарь производства.</p></section></div>`}
function renderWorkorders(){return `${pageHead('ОПЕРАЦИОННЫЕ РАБОТЫ','Технические задания','Создавайте задания, задавайте обязательные навыки и документы, находите исполнителей с объяснимыми причинами подбора.',`<button class="btn btn-primary" data-action="new-work">＋ Создать задание</button>`)}<div class="toolbar"><div class="toolbar-left"><input class="control" id="pageSearch" placeholder="Поиск задания…" value="${esc(pageSearch)}"><select class="select" id="workStatusFilter"><option value="">Все статусы</option>${state.workflowStatuses.map(s=>`<option>${esc(s)}</option>`).join('')}</select><select class="select" id="workPriorityFilter"><option value="">Все приоритеты</option><option>Высокий</option><option>Средний</option><option>Низкий</option></select></div><span class="muted" style="font-size:10px">Всего: ${state.workOrders.length}</span></div><div class="work-list" id="workList">${state.workOrders.filter(w=>[w.number,w.title,w.equipment].join(' ').toLowerCase().includes(pageSearch.toLowerCase())).map(workCard).join('')||'<div class="panel empty">Нет заданий по заданному фильтру</div>'}</div>`}
function renderAnalytics(){const total=state.employees.length;const skillCount=state.skills.length;const evaluated=state.employees.reduce((a,p)=>a+Object.keys(p.skills||{}).length,0);const possible=total*skillCount;const coverage=possible?Math.round(evaluated/possible*100):0;const assigned=state.workOrders.filter(w=>w.assignedTo).length;const load=state.employees.map(p=>({p,h:state.workOrders.filter(w=>w.assignedTo===p.id&&!['Закрыто','Отменено'].includes(w.status)).reduce((a,w)=>a+(w.estimate||0),0)}));return `${pageHead('УПРАВЛЕНЧЕСКАЯ АНАЛИТИКА','Показатели технической службы','Индикаторы построены на демонстрационных данных. В рабочей версии каждая метрика должна иметь формулу, период, источник и правила доступа.',`<button class="btn" data-action="export">⇩ Экспорт данных</button>`)}<div class="grid kpi-grid">${`<div class="kpi-box"><small>Покрытие матрицы навыков</small><strong>${coverage}%</strong><span>${evaluated} оценок из ${possible} возможных ячеек</span></div><div class="kpi-box"><small>Назначенные задания</small><strong>${assigned}/${state.workOrders.length}</strong><span>Доля заданий с исполнителем</span></div><div class="kpi-box"><small>Кадровый состав</small><strong>${total}</strong><span>Технические специалисты в системе</span></div>`}</div><div class="grid two-col" style="margin-top:16px"><section class="panel"><div class="panel-head"><h2>Загрузка по специалистам</h2><small>Плановые часы</small></div><div class="mini-bars">${load.map(x=>`<div class="bar-row"><span>${esc(x.p.name.split(' ')[0]+' '+(x.p.name.split(' ')[1]||''))}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,x.h/8*100)}%"></div></div><span class="bar-value">${x.h} ч</span></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><h2>Квалификационные риски</h2></div><div class="alert-list"><div class="alert-item"><div class="alert-mark danger">!</div><div><strong>${state.credentials.filter(d=>getDocStatus(d)==='danger').length} просроченных документов</strong><p>Перед назначением обязательного вида работ проверяйте срок действия допуска.</p></div></div><div class="alert-item"><div class="alert-mark">◈</div><div><strong>${state.skills.length} компетенций в каталоге</strong><p>${[...new Set(state.skills.map(s=>s.category))].length} категорий навыков.</p></div></div></div></section></div><p class="footer-note">Покрытие матрицы рассчитывается как число заполненных значений навыков / количество сотрудников, умноженное на количество навыков. Это заполненность данных, а не доказательство достаточности компетенций.</p>`}
function renderConfig(){const tabs=[['organization','Оргструктура'],['skills','Компетенции'],['scales','Шкалы оценок'],['credentialTypes','Типы допусков'],['fields','Поля карточек'],['workflow','Статусы работ'],['roles','Роли и права'],['modules','Модули'],['system','Система']];let body='';if(configTab==='organization')body=configOrganization();if(configTab==='skills')body=configSkills();if(configTab==='scales')body=configScales();if(configTab==='credentialTypes')body=configCredentialTypes();if(configTab==='fields')body=configFields();if(configTab==='workflow')body=configWorkflow();if(configTab==='roles')body=configRoles();if(configTab==='modules')body=configModules();if(configTab==='system')body=configSystem();return `${pageHead('АДМИНИСТРИРОВАНИЕ','Конфигуратор системы','Настройка предметной модели без изменения кода: структура предприятия, справочники, шкалы, дополнительные поля, статусы и состав модулей.',`<button class="btn" data-action="export">⇩ Экспорт конфигурации</button><button class="btn" data-action="import">⇧ Импорт JSON</button>`)}<div class="panel"><div class="settings-layout"><nav class="settings-nav">${tabs.map(([id,label])=>`<button data-config-tab="${id}" class="${configTab===id?'active':''}">${label}</button>`).join('')}</nav><div class="settings-content">${body}</div></div></div>`}
function configOrganization(){return `<div class="panel-head"><h2>Организационная структура</h2><button class="btn btn-primary btn-sm" data-action="new-unit">＋ Узел</button></div><div class="callout">Структура — справочная модель предприятия. Перемещение и архивирование узлов в промышленной версии должны сохранять исторические назначения сотрудников.</div><div class="tree">${state.org.map(u=>{const depth=u.parent?1:0;return `<div class="tree-item ${depth?'tree-indent':''}"><div class="tree-main"><span style="color:var(--accent)">${depth?'↳':'▣'}</span><span>${esc(u.name)}</span>${badge(u.type,'neutral')}<span class="muted" style="font-size:9px">Руководитель: ${esc(u.head||'Не назначен')}</span></div><div class="tree-actions"><button class="tiny-action" data-action="edit-unit" data-id="${u.id}">Изменить</button><button class="tiny-action" data-action="delete-unit" data-id="${u.id}">Удалить</button></div></div>`}).join('')}</div>`}
function configSkills(){return `<div class="panel-head"><h2>Каталог компетенций</h2><button class="btn btn-primary btn-sm" data-action="new-skill">＋ Компетенция</button></div><div class="callout">Категории и навыки полностью редактируемые. У каждого навыка выбирается шкала. Существующие оценки сотрудников сохраняются по ID навыка.</div><div class="tree">${[...new Set(state.skills.map(s=>s.category))].map(cat=>`<div><div class="tree-item" style="background:#f7faf9"><div class="tree-main"><span>▦</span>${esc(cat)}${badge(state.skills.filter(s=>s.category===cat).length+' навыков','neutral')}</div></div>${state.skills.filter(s=>s.category===cat).map(s=>`<div class="tree-item tree-indent"><div class="tree-main"><span style="color:#9aa6ac">⌁</span>${esc(s.name)}<span class="muted" style="font-size:9px">${esc(state.scales.find(x=>x.id===s.scaleId)?.name||'Шкала не задана')}</span></div><div class="tree-actions"><button class="tiny-action" data-action="edit-skill" data-id="${s.id}">Изменить</button><button class="tiny-action" data-action="delete-skill" data-id="${s.id}">Удалить</button></div></div>`).join('')}</div>`).join('')}</div>`}
function configScales(){return `<div class="panel-head"><h2>Шкалы оценки</h2><button class="btn btn-primary btn-sm" data-action="new-scale">＋ Создать шкалу</button></div><div class="callout">Шкалы не должны автоматически сравниваться между собой. Например, практический уровень навыка и группа формального допуска — разные типы данных.</div>${state.scales.map(s=>`<div class="tree-item" style="display:block;margin-bottom:9px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div class="tree-main">▤ ${esc(s.name)}</div><button class="tiny-action" data-action="edit-scale" data-id="${s.id}">Изменить</button></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${s.levels.map(l=>`<span class="badge neutral">${l.value} · ${esc(l.label)}</span>`).join('')}</div></div>`).join('')}`}
function configCredentialTypes(){return `<div class="panel-head"><h2>Типы квалификаций и допусков</h2><button class="btn btn-primary btn-sm" data-action="new-credential-type">＋ Тип документа</button></div><div class="callout">Настраивайте локальный каталог типов подтверждений. Сроки действия, обязательность и область применения должны настраиваться отдельно на уровне правил конкретного вида работ.</div><div class="tree">${state.credentialTypes.map(t=>`<div class="tree-item"><div class="tree-main"><span>▣</span><span>${esc(t.name)}</span><span class="muted" style="font-size:9px">${esc(t.scope||'Область не задана')}</span></div><div class="tree-actions"><button class="tiny-action" data-action="edit-credential-type" data-id="${t.id}">Изменить</button><button class="tiny-action" data-action="delete-credential-type" data-id="${t.id}">Удалить</button></div></div>`).join('')}</div>`}
function configRoles(){const labels={all:'Полный доступ',view:'Просмотр разрешённых данных',viewOwn:'Просмотр собственного профиля',managePersonnel:'Управление персоналом',approveSkills:'Утверждение компетенций',viewCredentials:'Просмотр допусков',manageWork:'Управление заданиями',updateOwnWork:'Обновление собственных заданий',viewAnalytics:'Просмотр аналитики'};return `<div class="panel-head"><h2>Роли и наборы разрешений</h2><button class="btn btn-primary btn-sm" data-action="new-role">＋ Роль</button></div><div class="callout">Прототип показывает настраиваемый каталог ролей и разрешений. Реальная защита должна выполняться на сервере с проверкой scope для каждой записи и операции; клиентские переключатели не являются механизмом безопасности.</div><div class="tree">${(state.roles||[]).map(r=>`<div class="tree-item" style="display:block"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div><strong style="font-size:11px">${esc(r.name)}</strong><div class="muted" style="font-size:9px;margin-top:4px">${esc(r.code)} · Область: ${esc(r.scope)}</div></div><div class="tree-actions"><button class="tiny-action" data-action="edit-role" data-id="${r.id}">Изменить</button><button class="tiny-action" data-action="delete-role" data-id="${r.id}">Удалить</button></div></div><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:10px">${(r.permissions||[]).map(x=>`<span class="badge neutral">${esc(labels[x]||x)}</span>`).join('')}</div></div>`).join('')}</div>`}
function configFields(){return `<div class="panel-head"><h2>Дополнительные поля карточек</h2><button class="btn btn-primary btn-sm" data-action="new-field">＋ Добавить поле</button></div><div class="callout">Позволяет расширить карточку сотрудника без изменения стандартной схемы. В прототипе значения сохраняются в объекте custom. Для production-системы нужны миграции метаданных, индексация, валидация и versioning.</div><div class="custom-field-list">${state.customFields.map(f=>`<div class="custom-field-row"><strong>${esc(f.label)}</strong><span class="muted">${esc(f.entity)} · ${esc(f.type)}</span><span>${f.required?'Обязательное':'Необязательное'}</span><div style="display:flex;gap:7px;align-items:center"><input class="toggle" type="checkbox" data-action="toggle-field" data-id="${f.id}" ${f.active?'checked':''} aria-label="Активность поля"><button class="tiny-action" data-action="delete-field" data-id="${f.id}">Удалить</button></div></div>`).join('')||'<div class="empty">Дополнительные поля не созданы</div>'}</div>`}
function configWorkflow(){return `<div class="panel-head"><h2>Жизненный цикл технического задания</h2><button class="btn btn-primary btn-sm" data-action="new-status">＋ Статус</button></div><div class="callout">Список статусов в этом прототипе настраивается, но переходы между статусами пока не являются полноценным workflow-графом. Следующий этап — конструктор переходов, условий и ролей.</div><div class="tree">${state.workflowStatuses.map((s,i)=>`<div class="tree-item"><div class="tree-main"><span class="muted">${String(i+1).padStart(2,'0')}</span>${esc(s)}</div><div class="tree-actions"><button class="tiny-action" data-action="edit-status" data-value="${esc(s)}">Переименовать</button><button class="tiny-action" data-action="delete-status" data-value="${esc(s)}">Удалить</button></div></div>`).join('')}</div>`}
function configModules(){const names={overview:['Обзор','Сводная панель предприятия'],personnel:['Персонал','Карточки сотрудников и структура'],matrix:['Компетенции','Каталог и матрица навыков'],credentials:['Допуски и документы','Квалификации и сроки действия'],planning:['Планирование','Доступность и загрузка'],workorders:['Технические задания','Заявки, требования, назначения'],analytics:['Аналитика','KPI и управленческие отчёты']};return `<div class="panel-head"><h2>Состав модулей</h2><small>Включение / отключение разделов</small></div><div class="callout">Модуль можно скрыть для конкретного внедрения. Отключение не удаляет данные. Доступ к данным должен дополнительно контролироваться на backend.</div>${Object.entries(names).map(([id,n])=>`<div class="module-row"><div><strong>${n[0]}</strong><p>${n[1]}</p></div><input class="toggle" type="checkbox" data-action="toggle-module" data-id="${id}" ${state.modules[id]?'checked':''} aria-label="Модуль ${n[0]}"></div>`).join('')}`}
function configSystem(){return `<div class="panel-head"><h2>Параметры предприятия и данные</h2></div><div class="form-grid"><div class="field"><label>Наименование предприятия</label><input id="settingCompany" value="${esc(state.settings.company)}"></div><div class="field"><label>Производственная площадка</label><input id="settingSite" value="${esc(state.settings.site)}"></div><div class="field"><label>Доступная мощность смены, часов</label><input id="settingHours" type="number" min="1" max="24" value="${state.settings.capacityHours}"></div><div class="field"><label>Начало недели</label><select id="settingWeek"><option ${state.settings.weekStart==='Понедельник'?'selected':''}>Понедельник</option><option ${state.settings.weekStart==='Воскресенье'?'selected':''}>Воскресенье</option></select></div></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-primary" data-action="save-settings">Сохранить параметры</button><button class="btn" data-action="export">Экспорт полного JSON</button><button class="btn btn-danger" data-action="reset">Сбросить демоданные</button></div><p class="footer-note">Хранилище: localStorage браузера. Для командной работы, резервного копирования и аудита необходим backend и серверная база данных. Не используйте прототип для хранения реальных персональных данных или юридически значимых допусков.</p>`}
function openModal(title,body,buttons=''){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>${title}</h3><button class="close-x" data-action="close-modal" aria-label="Закрыть">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${buttons||'<button class="btn" data-action="close-modal">Закрыть</button>'}</div></div></div>`;root.querySelector('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()})}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function modalButtons(saveAction){return `<button class="btn" data-action="close-modal">Отмена</button><button class="btn btn-primary" data-action="${saveAction}">Сохранить</button>`}
function personForm(p){const isEdit=!!p;const skillFields=state.skills.map(s=>{const sc=state.scales.find(x=>x.id===s.scaleId);const levels=sc?.levels||[0,1,2,3,4].map((value)=>({value,label:['Нет данных','Базовый','Самостоятельный','Продвинутый','Эксперт'][value]}));return `<div class="field"><label>${esc(s.name)}</label><select name="skill_${s.id}"><option value="">Не оценено</option>${levels.map(l=>`<option value="${l.value}" ${p?.skills?.[s.id]===l.value?'selected':''}>${l.value} · ${esc(l.label)}</option>`).join('')}</select></div>`}).join('');const custom=state.customFields.filter(f=>f.entity==='employee'&&f.active).map(f=>`<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label><input name="custom_${f.id}" value="${esc(p?.custom?.[f.id]||'')}" ${f.required?'required':''}></div>`).join('');openModal(isEdit?'Карточка специалиста':'Новый специалист',`<form id="personForm"><div class="form-grid"><div class="field"><label>ФИО *</label><input name="name" required value="${esc(p?.name||'')}"></div><div class="field"><label>Должность *</label><input name="position" required value="${esc(p?.position||'')}"></div><div class="field"><label>Подразделение</label><select name="unit">${state.org.map(u=>`<option value="${u.id}" ${p?.unit===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div><div class="field"><label>Статус</label><select name="status">${['Активен','Неактивен','В отпуске'].map(s=>`<option ${p?.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Доступность</label><select name="availability">${['Доступен','Занят','Отсутствует'].map(s=>`<option ${p?.availability===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Смена</label><select name="shift">${['День','Ночь','Сменный график','Не задано'].map(s=>`<option ${p?.shift===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Email</label><input type="email" name="email" value="${esc(p?.email||'')}"></div><div class="field"><label>Телефон</label><input name="phone" value="${esc(p?.phone||'')}"></div><div class="field full"><strong style="font-size:11px">Компетенции</strong><span class="field-help">Демонстрационный текущий уровень. Для целевой системы требуется история оценок и утверждение руководителем.</span></div>${skillFields}${custom}</div><input type="hidden" name="id" value="${p?.id||''}"></form>`,modalButtons('save-person'))}
function unitForm(u){openModal(u?'Изменить организационный узел':'Новый организационный узел',`<form id="unitForm"><div class="form-grid"><div class="field"><label>Название *</label><input name="name" required value="${esc(u?.name||'')}"></div><div class="field"><label>Тип</label><select name="type">${['Предприятие','Площадка','Служба','Подразделение','Группа','Бригада'].map(x=>`<option ${u?.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Родительский узел</label><select name="parent"><option value="">Нет</option>${state.org.filter(x=>x.id!==u?.id).map(x=>`<option value="${x.id}" ${u?.parent===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Руководитель</label><input name="head" value="${esc(u?.head||'')}"></div></div><input type="hidden" name="id" value="${u?.id||''}"></form>`,modalButtons('save-unit'))}
function skillForm(s){openModal(s?'Изменить компетенцию':'Новая компетенция',`<form id="skillForm"><div class="form-grid"><div class="field"><label>Наименование *</label><input name="name" required value="${esc(s?.name||'')}"></div><div class="field"><label>Категория *</label><input name="category" list="skillCats" required value="${esc(s?.category||'')}"><datalist id="skillCats">${[...new Set(state.skills.map(x=>x.category))].map(x=>`<option>${esc(x)}</option>`).join('')}</datalist></div><div class="field full"><label>Шкала оценки</label><select name="scaleId">${state.scales.map(x=>`<option value="${x.id}" ${s?.scaleId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div></div><input type="hidden" name="id" value="${s?.id||''}"></form>`,modalButtons('save-skill'))}
function scaleForm(s){const levels=s?.levels||[{value:0,label:'Нет данных'},{value:1,label:'Базовый'},{value:2,label:'Самостоятельный'},{value:3,label:'Продвинутый'},{value:4,label:'Эксперт'}];openModal(s?'Настроить шкалу':'Новая шкала',`<form id="scaleForm"><div class="field"><label>Название шкалы *</label><input name="name" required value="${esc(s?.name||'Новая шкала')}"></div><div class="field" style="margin-top:12px"><label>Уровни (одно значение на строку в формате: число|название)</label><textarea name="levels" style="min-height:145px">${levels.map(l=>`${l.value}|${l.label}`).join('\n')}</textarea><span class="field-help">Пример: 0|Не оценено</span></div><input type="hidden" name="id" value="${s?.id||''}"></form>`,modalButtons('save-scale'))}
function fieldForm(){openModal('Новое пользовательское поле',`<form id="fieldForm"><div class="form-grid"><div class="field"><label>Название *</label><input name="label" required></div><div class="field"><label>Сущность</label><select name="entity"><option value="employee">Сотрудник</option></select></div><div class="field"><label>Тип данных</label><select name="type"><option value="text">Текст</option><option value="number">Число</option><option value="date">Дата</option><option value="boolean">Да/Нет</option></select></div><div class="field"><label>Обязательное</label><select name="required"><option value="false">Нет</option><option value="true">Да</option></select></div></div></form>`,modalButtons('save-field'))}
function credentialTypeForm(t){openModal(t?'Изменить тип допуска':'Новый тип допуска',`<form id="credentialTypeForm"><div class="form-grid"><div class="field"><label>Название *</label><input name="name" required value="${esc(t?.name||'')}"></div><div class="field"><label>Область применения</label><input name="scope" value="${esc(t?.scope||'')}"></div></div><input type="hidden" name="id" value="${t?.id||''}"></form>`,modalButtons('save-credential-type'))}
function roleForm(r){const perms=[['view','Просмотр разрешённых данных'],['viewOwn','Просмотр собственного профиля'],['managePersonnel','Управление персоналом'],['approveSkills','Утверждение компетенций'],['viewCredentials','Просмотр допусков'],['manageWork','Управление заданиями'],['updateOwnWork','Обновление собственных заданий'],['viewAnalytics','Просмотр аналитики'],['all','Полный доступ']];openModal(r?'Изменить роль':'Новая роль',`<form id="roleForm"><div class="form-grid"><div class="field"><label>Наименование *</label><input name="name" required value="${esc(r?.name||'')}"></div><div class="field"><label>Код *</label><input name="code" required value="${esc(r?.code||'')}"></div><div class="field full"><label>Область действия (scope)</label><select name="scope">${['Предприятие','Предприятие / служба','Служба','Подразделение','Бригада','Собственные данные и задания','Разрешённая область'].map(x=>`<option ${r?.scope===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Разрешения</label><div class="form-grid">${perms.map(([id,label])=>`<label style="display:flex;align-items:center;gap:7px;font-size:10px;font-weight:500"><input type="checkbox" name="perm_${id}" ${r?.permissions?.includes(id)?'checked':''}>${label}</label>`).join('')}</div></div></div><input type="hidden" name="id" value="${r?.id||''}"></form>`,modalButtons('save-role'))}
function credentialForm(d){openModal(d?'Изменить документ':'Добавить документ',`<form id="credentialForm"><div class="form-grid"><div class="field"><label>Сотрудник *</label><select name="personId" required>${state.employees.map(p=>`<option value="${p.id}" ${d?.personId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Тип документа *</label><select name="typeId">${state.credentialTypes.map(t=>`<option value="${t.id}" ${d?.typeId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Номер</label><input name="number" value="${esc(d?.number||'')}"></div><div class="field"><label>Выдавшая организация</label><input name="issuer" value="${esc(d?.issuer||'')}"></div><div class="field"><label>Дата выдачи</label><input type="date" name="issued" value="${esc(d?.issued||'')}"></div><div class="field"><label>Действует до</label><input type="date" name="expires" value="${esc(d?.expires||'')}"></div></div><input type="hidden" name="id" value="${d?.id||''}"></form>`,modalButtons('save-credential'))}
function workForm(w){const sk=w?.skills||[];const creds=w?.credentials||[];openModal(w?'Изменить техническое задание':'Новое техническое задание',`<form id="workForm"><div class="form-grid"><div class="field"><label>Номер задания *</label><input name="number" required value="${esc(w?.number||('WO-26-'+String(150+state.workOrders.length).padStart(4,'0')))}"></div><div class="field"><label>Приоритет</label><select name="priority">${['Высокий','Средний','Низкий'].map(x=>`<option ${w?.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Наименование работы *</label><input name="title" required value="${esc(w?.title||'')}"></div><div class="field full"><label>Оборудование / участок</label><input name="equipment" value="${esc(w?.equipment||'')}"></div><div class="field"><label>Срок выполнения</label><input type="date" name="due" value="${esc(w?.due||'2026-11-14')}"></div><div class="field"><label>Оценка трудоёмкости, ч</label><input type="number" min="1" max="200" name="estimate" value="${w?.estimate||2}"></div><div class="field"><label>Статус</label><select name="status">${state.workflowStatuses.map(x=>`<option ${w?.status===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Назначенный исполнитель</label><select name="assignedTo"><option value="">Не назначен</option>${state.employees.map(p=>`<option value="${p.id}" ${w?.assignedTo===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field full"><strong style="font-size:11px">Требуемые компетенции</strong><span class="field-help">Выберите навык и минимальный уровень. Требования используются механизмом подбора.</span></div>${state.skills.map(s=>{const r=sk.find(x=>x.skillId===s.id);return `<div class="field"><label>${esc(s.name)}</label><select name="req_${s.id}"><option value="">Не требуется</option>${[1,2,3,4].map(n=>`<option value="${n}" ${r?.min===n?'selected':''}>Минимум ${n}</option>`).join('')}</select></div>`}).join('')}<div class="field full"><strong style="font-size:11px">Обязательные допуски</strong></div>${state.credentialTypes.map(t=>{const r=creds.find(x=>x.typeId===t.id);return `<div class="field"><label><input type="checkbox" name="cred_${t.id}" ${r?'checked':''} style="width:auto;margin-right:6px">${esc(t.name)}</label></div>`}).join('')}</div><input type="hidden" name="id" value="${w?.id||''}"></form>`,modalButtons('save-work'))}
function statusForm(value){openModal(value?'Переименовать статус':'Добавить статус',`<form id="statusForm"><div class="field"><label>Название статуса *</label><input name="value" required value="${esc(value||'')}"></div><input type="hidden" name="old" value="${esc(value||'')}"></form>`,modalButtons('save-status'))}
function matching(w){const candidates=state.employees.filter(p=>p.status==='Активен');return candidates.map(p=>{let reasons=[],blocked=[];if(p.availability==='Отсутствует')blocked.push('Сотрудник отсутствует');const savedWork=state.workOrders.find(x=>x.id===w.id);const alreadyThisWork=savedWork?.assignedTo===p.id;if(p.availability==='Занят'&&!alreadyThisWork)blocked.push('Текущая доступность: занят');let workload=state.workOrders.filter(x=>x.id!==w.id&&x.assignedTo===p.id&&!['Закрыто','Отменено'].includes(x.status)).reduce((a,x)=>a+(Number(x.estimate)||0),0);if(workload+(Number(w.estimate)||0)>(Number(state.settings.capacityHours)||8))blocked.push('Недостаточно свободной мощности');let passed=0,reqs=w.skills||[];reqs.forEach(r=>{const actual=p.skills?.[r.skillId];if(actual===undefined||actual<r.min)blocked.push(`Навык ${skill(r.skillId)?.name||'неизвестен'}: нужно ${r.min}, есть ${actual??'нет оценки'}`);else{passed++;reasons.push(`${skill(r.skillId)?.name}: уровень ${actual}`)}});(w.credentials||[]).filter(c=>c.mandatory).forEach(r=>{const docs=state.credentials.filter(d=>d.personId===p.id&&d.typeId===r.typeId);const valid=docs.some(d=>getDocStatus(d)==='success');if(!valid)blocked.push(`Нет действующего допуска: ${credentialType(r.typeId)?.name||'документ'}`);else reasons.push(`Допуск действителен: ${credentialType(r.typeId)?.name}`)});const score=reqs.length?Math.round(passed/reqs.length*100):100;return {p,blocked,reasons,workload,score,eligible:blocked.length===0}}).sort((a,b)=>Number(b.eligible)-Number(a.eligible)||b.score-a.score||a.workload-b.workload)}
function workDetail(id){const w=state.workOrders.find(x=>x.id===id);if(!w)return;const cands=matching(w);const assigned=person(w.assignedTo);openModal(`${esc(w.number)} · ${esc(w.title)}`,`<div class="detail-kv"><div class="kv"><small>Оборудование</small><strong>${esc(w.equipment||'—')}</strong></div><div class="kv"><small>Срок</small><strong>${esc(w.due||'Не задан')}</strong></div><div class="kv"><small>Статус</small><strong>${esc(w.status)}</strong></div><div class="kv"><small>Приоритет / трудоёмкость</small><strong>${esc(w.priority)} · ${w.estimate} ч</strong></div><div class="kv"><small>Текущий исполнитель</small><strong>${esc(assigned?.name||'Не назначен')}</strong></div><div class="kv"><small>Требования</small><strong>${(w.skills||[]).length} навыков · ${(w.credentials||[]).length} допусков</strong></div></div><div class="detail-section"><h4>Подбор исполнителей</h4><p class="field-help">Сначала применяются жёсткие ограничения: активность, доступность, мощность, минимальные навыки и действующие обязательные допуски. Рейтинг не может отменить блокирующее условие.</p>${cands.map(x=>`<div class="candidate"><div><strong>${esc(x.p.name)} ${x.eligible?badge('Подходит','success'):badge('Есть ограничения','danger')}</strong><p>${x.eligible?(x.reasons.join(' · ')||'Нет дополнительных требований'):(x.blocked.map(esc).join('<br>'))}<br>Текущая загрузка: ${x.workload} ч</p></div><div style="text-align:right"><div class="candidate-score">${x.score}%</div>${x.eligible?`<button class="btn btn-sm btn-primary" style="margin-top:6px" data-action="assign-person" data-work="${w.id}" data-person="${x.p.id}">Назначить</button>`:''}</div></div>`).join('')}</div><div class="footer-note">Рекомендация алгоритма не является разрешением на опасную работу. Перед назначением требуется проверка ответственным лицом.</div>`,`<button class="btn" data-action="close-modal">Закрыть</button><button class="btn" data-action="edit-work" data-id="${w.id}">Изменить задание</button>`);}
function formData(id){const f=document.getElementById(id);return Object.fromEntries(new FormData(f).entries())}
function handleAction(action,el){const id=el.dataset.id;switch(action){case 'close-modal':closeModal();break;case 'new-person':personForm();break;case 'edit-person':personForm(person(id));break;case 'save-person':{const d=formData('personForm');const skills={};state.skills.forEach(s=>{const v=d['skill_'+s.id];if(v!=='')skills[s.id]=Number(v)});const custom={};state.customFields.filter(f=>f.active&&f.entity==='employee').forEach(f=>custom[f.id]=d['custom_'+f.id]||'');const data={id:d.id||uid('p'),name:d.name.trim(),position:d.position.trim(),unit:d.unit,status:d.status,availability:d.availability,shift:d.shift,email:d.email,phone:d.phone,skills,credentials:person(d.id)?.credentials||[],custom};const i=state.employees.findIndex(p=>p.id===data.id);if(i>=0)state.employees[i]=data;else state.employees.push(data);save();closeModal();render();toast('Карточка сотрудника сохранена');break}
case 'new-unit':unitForm();break;case 'edit-unit':unitForm(state.org.find(x=>x.id===id));break;case 'save-unit':{const d=formData('unitForm');const data={id:d.id||uid('u'),name:d.name.trim(),type:d.type,parent:d.parent||null,head:d.head};const i=state.org.findIndex(x=>x.id===data.id);if(i>=0)state.org[i]=data;else state.org.push(data);save();closeModal();render();toast('Организационный узел сохранён');break}case 'delete-unit':{if(state.employees.some(p=>p.unit===id)||state.org.some(x=>x.parent===id)){toast('Нельзя удалить узел: есть сотрудники или дочерние узлы');break}if(confirm('Удалить организационный узел?')){state.org=state.org.filter(x=>x.id!==id);save();render()}break}
case 'new-skill':skillForm();break;case 'edit-skill':skillForm(skill(id));break;case 'save-skill':{const d=formData('skillForm');const data={id:d.id||uid('sk'),name:d.name.trim(),category:d.category.trim(),scaleId:d.scaleId};const i=state.skills.findIndex(x=>x.id===data.id);if(i>=0)state.skills[i]=data;else state.skills.push(data);save();closeModal();render();toast('Компетенция сохранена');break}case 'delete-skill':{if(state.employees.some(p=>p.skills?.[id]!==undefined)||state.workOrders.some(w=>w.skills?.some(x=>x.skillId===id))){toast('Навык используется в данных. Архивирование доступно в полной версии.');break}if(confirm('Удалить компетенцию?')){state.skills=state.skills.filter(x=>x.id!==id);save();render()}break}
case 'new-scale':scaleForm();break;case 'edit-scale':scaleForm(state.scales.find(x=>x.id===id));break;case 'save-scale':{const d=formData('scaleForm');const levels=d.levels.split('\n').map(line=>line.split('|')).filter(x=>x.length>=2&&x[0].trim()!==''&&x[1].trim()!=='').map(x=>({value:Number(x[0].trim()),label:x.slice(1).join('|').trim()}));if(!levels.length||levels.some(x=>!Number.isFinite(x.value))){toast('Проверьте формат уровней');break}const data={id:d.id||uid('s'),name:d.name.trim(),levels};const i=state.scales.findIndex(x=>x.id===data.id);if(i>=0)state.scales[i]=data;else state.scales.push(data);save();closeModal();render();toast('Шкала сохранена');break}
case 'new-field':fieldForm();break;case 'save-field':{const d=formData('fieldForm');state.customFields.push({id:uid('f'),label:d.label.trim(),entity:d.entity,type:d.type,required:d.required==='true',active:true});save();closeModal();render();toast('Поле добавлено в конфигуратор');break}case 'toggle-field':{const f=state.customFields.find(x=>x.id===id);if(f){f.active=el.checked;save();render();}break}case 'delete-field':if(confirm('Удалить определение поля? Значения в карточках могут остаться в резервной копии.')){state.customFields=state.customFields.filter(x=>x.id!==id);save();render()}break;
case 'new-status':statusForm();break;case 'edit-status':statusForm(el.dataset.value);break;case 'save-status':{const d=formData('statusForm');if(state.workflowStatuses.includes(d.value.trim())&&d.value.trim()!==d.old){toast('Такой статус уже существует');break}if(d.old){state.workflowStatuses=state.workflowStatuses.map(x=>x===d.old?d.value.trim():x);state.workOrders.forEach(w=>{if(w.status===d.old)w.status=d.value.trim()})}else state.workflowStatuses.push(d.value.trim());save();closeModal();render();toast('Статус сохранён');break}case 'delete-status':{const v=el.dataset.value;if(state.workOrders.some(w=>w.status===v)){toast('Статус используется заданиями');break}if(confirm('Удалить статус?')){state.workflowStatuses=state.workflowStatuses.filter(x=>x!==v);save();render()}break}
case 'toggle-module':state.modules[id]=el.checked;save();render();toast('Настройка модуля сохранена');break;case 'save-settings':state.settings.company=document.getElementById('settingCompany').value;state.settings.site=document.getElementById('settingSite').value;state.settings.capacityHours=Math.max(1,Math.min(24,Number(document.getElementById('settingHours').value)||8));state.settings.weekStart=document.getElementById('settingWeek').value;save();render();toast('Параметры сохранены');break;
case 'new-credential-type':credentialTypeForm();break;case 'edit-credential-type':credentialTypeForm(credentialType(id));break;case 'save-credential-type':{const d=formData('credentialTypeForm');const data={id:d.id||uid('ct'),name:d.name.trim(),scope:d.scope.trim()};const i=state.credentialTypes.findIndex(x=>x.id===data.id);if(i>=0)state.credentialTypes[i]=data;else state.credentialTypes.push(data);save();closeModal();render();toast('Тип документа сохранён');break}case 'delete-credential-type':{if(state.credentials.some(x=>x.typeId===id)||state.workOrders.some(w=>w.credentials?.some(x=>x.typeId===id))){toast('Тип используется в документах или заданиях');break}if(confirm('Удалить тип документа?')){state.credentialTypes=state.credentialTypes.filter(x=>x.id!==id);save();render()}break}
case 'new-role':roleForm();break;case 'edit-role':roleForm((state.roles||[]).find(x=>x.id===id));break;case 'save-role':{const d=formData('roleForm');const permissions=['view','viewOwn','managePersonnel','approveSkills','viewCredentials','manageWork','updateOwnWork','viewAnalytics','all'].filter(x=>d['perm_'+x]==='on');const data={id:d.id||uid('r'),name:d.name.trim(),code:d.code.trim().toUpperCase(),scope:d.scope,permissions};const i=(state.roles||[]).findIndex(x=>x.id===data.id);if(i>=0)state.roles[i]=data;else state.roles.push(data);save();closeModal();render();toast('Роль сохранена');break}case 'delete-role':{if(id==='r1'){toast('Системную роль администратора удалить нельзя');break}if(confirm('Удалить роль?')){state.roles=state.roles.filter(x=>x.id!==id);save();render()}break}
case 'new-credential':credentialForm();break;case 'edit-credential':credentialForm(state.credentials.find(x=>x.id===id));break;case 'save-credential':{const d=formData('credentialForm');const data={id:d.id||uid('c'),personId:d.personId,typeId:d.typeId,number:d.number,issuer:d.issuer,issued:d.issued,expires:d.expires,status:'Действует'};const i=state.credentials.findIndex(x=>x.id===data.id);if(i>=0)state.credentials[i]=data;else state.credentials.push(data);save();closeModal();render();toast('Документ сохранён');break}
case 'new-work':workForm();break;case 'edit-work':workForm(state.workOrders.find(x=>x.id===id));break;case 'save-work':{const d=formData('workForm');const old=state.workOrders.find(x=>x.id===d.id);const skills=state.skills.map(s=>({skillId:s.id,min:Number(d['req_'+s.id])})).filter(x=>x.min>0);const credentials=state.credentialTypes.filter(t=>d['cred_'+t.id]==='on').map(t=>({typeId:t.id,mandatory:true}));const data={id:d.id||uid('w'),number:d.number.trim(),title:d.title.trim(),equipment:d.equipment,priority:d.priority,status:d.status,due:d.due,estimate:Math.max(1,Number(d.estimate)||1),skills,credentials,assignedTo:d.assignedTo||null};if(data.assignedTo){const gate=matching(data).find(x=>x.p.id===data.assignedTo);if(!gate?.eligible){toast('Нельзя сохранить назначение: '+(gate?.blocked?.[0]||'исполнитель не прошёл проверку'));break}}const i=state.workOrders.findIndex(x=>x.id===data.id);if(i>=0)state.workOrders[i]=data;else state.workOrders.unshift(data);if(data.assignedTo){const ep=person(data.assignedTo);if(ep)ep.availability='Занят'}if(old?.assignedTo&&old.assignedTo!==data.assignedTo){const previous=person(old.assignedTo);if(previous&&!state.workOrders.some(x=>x.id!==data.id&&x.assignedTo===previous.id&&!['Закрыто','Отменено'].includes(x.status)))previous.availability='Доступен'}if(['Закрыто','Отменено'].includes(data.status)&&data.assignedTo){const ep=person(data.assignedTo);if(ep&&!state.workOrders.some(x=>x.id!==data.id&&x.assignedTo===ep.id&&!['Закрыто','Отменено'].includes(x.status)))ep.availability='Доступен'}save();closeModal();render();toast('Техническое задание сохранено');break}
case 'work-detail':workDetail(id);break;case 'assign-person':{const w=state.workOrders.find(x=>x.id===el.dataset.work);const p=person(el.dataset.person);if(!w||!p)break;const result=matching(w).find(x=>x.p.id===p.id);if(!result?.eligible){toast('Назначение заблокировано ограничениями');break}w.assignedTo=p.id;if(w.status==='Открыто')w.status=state.workflowStatuses.includes('Назначено')?'Назначено':w.status;p.availability='Занят';save();closeModal();render();toast(`Исполнитель назначен: ${p.name}`);break}
case 'new-absence':toast('В прототипе смена доступности редактируется в карточке сотрудника');break;case 'export':exportJSON();break;case 'import':importJSON();break;case 'export-csv':exportCSV();break;case 'matrix-export':exportMatrix();break;case 'reset':if(confirm('Сбросить все изменения и восстановить демонстрационные данные?')){state=seed();save();render();toast('Демоданные восстановлены')}break;}
}
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});download(blob,'twm-backup.json');toast('Резервная копия подготовлена')}
function download(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importJSON(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{const file=input.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data.employees||!data.skills||!data.workOrders||!data.org)throw new Error('Структура JSON не похожа на TWM');state=data;save();render();toast('Данные импортированы')}catch(e){alert('Импорт не выполнен: '+e.message)}};input.click()}
function exportCSV(){const rows=[['ФИО','Должность','Подразделение','Смена','Доступность','Статус'],...state.employees.map(p=>[p.name,p.position,unitName(p.unit),p.shift,p.availability,p.status])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'twm-personnel.csv')}
function exportMatrix(){const rows=[['Сотрудник','Должность',...state.skills.map(s=>s.name)],...state.employees.map(p=>[p.name,p.position,...state.skills.map(s=>p.skills?.[s.id]??'')])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'twm-competence-matrix.csv')}
// Navigation and delegated actions
document.querySelector('.sidebar').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
document.getElementById('pageContent').addEventListener('click',e=>{const pg=e.target.closest('[data-page]');if(pg){setPage(pg.dataset.page);return}const tab=e.target.closest('[data-config-tab]');if(tab){configTab=tab.dataset.configTab;render();return}const b=e.target.closest('[data-action]');if(b)handleAction(b.dataset.action,b)});
document.getElementById('pageContent').addEventListener('change',e=>{const a=e.target.dataset.action;if(a)handleAction(a,e.target);if(e.target.id==='unitFilter'||e.target.id==='workStatusFilter'||e.target.id==='workPriorityFilter'||e.target.id==='categoryFilter')applyFilters()});
document.getElementById('pageContent').addEventListener('input',e=>{if(e.target.id==='pageSearch'){pageSearch=e.target.value;if(currentPage==='personnel')filterPersonnel();if(currentPage==='workorders')filterWorks()}if(e.target.id==='matrixSearch'||e.target.id==='categoryFilter')filterMatrix()});
document.getElementById('modalRoot').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)handleAction(b.dataset.action,b)});
document.getElementById('quickCreate').addEventListener('click',()=>{if(currentPage==='personnel')personForm();else if(currentPage==='matrix'){setPage('config');configTab='skills';render();}else if(currentPage==='credentials')credentialForm();else if(currentPage==='config'){configTab='organization';render();}else workForm()});
document.getElementById('exportTop').addEventListener('click',exportJSON);
document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){pageSearch=e.target.value;setPage('personnel');document.getElementById('pageSearch').value=pageSearch;filterPersonnel()}});
function applyFilters(){if(currentPage==='personnel')filterPersonnel();if(currentPage==='workorders')filterWorks();if(currentPage==='matrix')filterMatrix()}
function filterPersonnel(){const q=(document.getElementById('pageSearch')?.value||'').toLowerCase();const unit=document.getElementById('unitFilter')?.value||'';document.querySelectorAll('[data-person-row]').forEach(tr=>{const p=person(tr.dataset.personRow);tr.style.display=(!q||[p.name,p.position,unitName(p.unit)].join(' ').toLowerCase().includes(q))&&(!unit||p.unit===unit)?'':'none'})}
function filterWorks(){const q=(document.getElementById('pageSearch')?.value||'').toLowerCase();const st=document.getElementById('workStatusFilter')?.value||'';const pr=document.getElementById('workPriorityFilter')?.value||'';const items=state.workOrders.filter(w=>[w.number,w.title,w.equipment].join(' ').toLowerCase().includes(q)&&(!st||w.status===st)&&(!pr||w.priority===pr));document.getElementById('workList').innerHTML=items.map(workCard).join('')||'<div class="panel empty">Нет заданий по заданному фильтру</div>'}
function filterMatrix(){const q=(document.getElementById('matrixSearch')?.value||'').toLowerCase();const cat=document.getElementById('categoryFilter')?.value||'';document.querySelectorAll('#matrixTable thead th').forEach((th,i)=>{if(i===0)return;const s=state.skills[i-1];th.style.display=(!cat||s?.category===cat)&&(!q||s?.name.toLowerCase().includes(q))?'':'none'});document.querySelectorAll('#matrixTable tbody tr').forEach(tr=>{const p=person(tr.querySelector('[data-person-row]')?.dataset.personRow)||state.employees.find(x=>tr.textContent.includes(x.name));tr.style.display=!q||tr.textContent.toLowerCase().includes(q)?'':'none';Array.from(tr.children).forEach((td,i)=>{if(i>0){const s=state.skills[i-1];td.style.display=(!cat||s?.category===cat)&&(!q||s?.name.toLowerCase().includes(q))?'':'none'}})})}
render();
})();
</script>
</body>
