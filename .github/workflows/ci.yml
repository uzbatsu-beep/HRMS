
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, migration and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: twm_test
          POSTGRES_USER: twm
          POSTGRES_PASSWORD: twm_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twm -d twm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TWM_APP_ENV: test
      TWM_DATABASE_URL: postgresql+psycopg://twm:twm_test_password@localhost:5432/twm_test
      TWM_PG_CONCURRENCY_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: backend
        run: ruff check .
      - name: Validate Markdown internal links
        run: python scripts/check_docs.py
      - name: Test Markdown link checker
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Backend tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend - typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript check
        working-directory: frontend
        run: npm run check
      - name: Production build
        working-directory: frontend
        run: npm run build

  e2e:
    name: Browser E2E - Chromium and synthetic data
    runs-on: ubuntu-latest
    # Independent job: run in parallel with backend and frontend unit gates.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: twm_e2e
          POSTGRES_USER: twm_e2e
          POSTGRES_PASSWORD: disposable_ci_database_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twm_e2e -d twm_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TWM_APP_ENV: test
      TWM_DATABASE_URL: postgresql+psycopg://twm_e2e:disposable_ci_database_only@127.0.0.1:5432/twm_e2e
      E2E_BASE_URL: http://127.0.0.1:5173
      E2E_ALLOW_SEED: "1"
      E2E_ADMIN_USERNAME: e2e_admin
      VITE_API_PROXY_TARGET: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install API
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Install browser test runner
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Validate Playwright TypeScript
        working-directory: frontend
        run: npm run test:e2e:check
      - name: Generate one-run admin and reviewer passwords
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets
          for name in ("E2E_ADMIN_PASSWORD", "E2E_ACTOR_PASSWORD"):
              token = secrets.token_urlsafe(32)
              print("::add-mask::" + token)
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
                  out.write(name + "=" + token + "\n")
          PY
      - name: Apply isolated test migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Create ephemeral admin account
        working-directory: backend
        env:
          TWM_ADMIN_USERNAME: e2e_admin
          TWM_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
        run: python -m app.identity.bootstrap_admin
      - name: Start API
        working-directory: backend
        shell: bash
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend-e2e.log 2>&1 &
          for i in {1..45}; do
            curl --silent --fail http://127.0.0.1:8000/api/v1/health/ready && exit 0
            sleep 2
          done
          cat ../backend-e2e.log
          exit 1
      - name: Run browser acceptance scenarios
        working-directory: frontend
        env:
          E2E_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
          E2E_ACTOR_PASSWORD: ${{ env.E2E_ACTOR_PASSWORD }}
        run: npm run test:e2e
      - name: Bounded synthetic API readiness latency probe
        working-directory: frontend
        run: python ../ops/load_probe.py --requests 160 --concurrency 8 --p95-ms 1500

      - name: Upload screenshots, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend-e2e.log

  dr_drill:
    name: PostgreSQL backup and isolated restore drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: twm_dr
          POSTGRES_USER: twm_dr
          POSTGRES_PASSWORD: disposable_dr_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twm_dr -d twm_dr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build PostgreSQL 16 recovery tool image
        run: docker build -t twm-postgres-dr -f ops/Dockerfile.postgres-dr ops
      - name: Create synthetic backup and verify isolated restore
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/twm-dr"
          printf '127.0.0.1:5432:*:twm_dr:disposable_dr_ci_password\n' > "$RUNNER_TEMP/twm-dr/pgpass"
          chmod 600 "$RUNNER_TEMP/twm-dr/pgpass"
          dr() {
            docker run --rm --network host \
              -e PGHOST=127.0.0.1 -e PGPORT=5432 \
              -e PGDATABASE=twm_dr -e PGUSER=twm_dr \
              -e PGPASSFILE=/out/pgpass \
              -v "$RUNNER_TEMP/twm-dr:/out" twm-postgres-dr "$@"
          }
          dr psql --no-password --dbname twm_dr --set ON_ERROR_STOP=1 \
            --command "CREATE TABLE alembic_version (version_num text NOT NULL);
            INSERT INTO alembic_version VALUES ('ci_synthetic_dr');
            CREATE TABLE pilot_dr_canary (id integer PRIMARY KEY, value text NOT NULL);
            INSERT INTO pilot_dr_canary VALUES (1, 'restore-verified');"
          dr python3 /tools/postgres_dr.py backup --out /out/synthetic.dump
          # All artifacts have owner-only permissions inside the tool image.
          # Never weaken archive permissions merely to let the runner copy them.
          dr cp /out/synthetic.dump /out/damaged.dump
          dr cp /out/synthetic.dump.manifest.json /out/damaged.dump.manifest.json
          dr sh -c "printf 'corruption' >> /out/damaged.dump"
          if dr env TWM_RESTORE_ALLOW=1 python3 /tools/postgres_dr.py restore \
            --file /out/damaged.dump --target-db twm_restore_bad; then
            echo "Expected checksum rejection" >&2
            exit 1
          fi
          dr env TWM_RESTORE_ALLOW=1 python3 /tools/postgres_dr.py restore \
            --file /out/synthetic.dump --target-db twm_restore_ci
          test "$(dr psql --no-password --dbname twm_restore_ci -At \
            --command "SELECT value FROM pilot_dr_canary WHERE id=1")" = "restore-verified"
          test "$(dr psql --no-password --dbname twm_restore_ci -At \
            --command "SELECT version_num FROM alembic_version")" = "ci_synthetic_dr"
          # Repeat restore into an existing target must be rejected, never overwritten.
          if dr env TWM_RESTORE_ALLOW=1 python3 /tools/postgres_dr.py restore \
            --file /out/synthetic.dump --target-db twm_restore_ci; then
            echo "Expected existing-target rejection" >&2
            exit 1
          fi
          echo "Synthetic PostgreSQL backup/restore drill PASS"

  pilot_smoke:
    name: Pilot images and synthetic HTTPS smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Create one-run TLS and secret files, build and verify pilot
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secrets="$RUNNER_TEMP/twm-pilot-ci"
          mkdir -p "$secrets"
          printf 'synthetic-ci-strong-db-passphrase\n' > "$secrets/postgres_password"
          printf 'synthetic-ci-HMAC-secret-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ\n' \
            > "$secrets/throttle_hmac"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$secrets/key.pem" -out "$secrets/cert.pem" \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost" \
            >/dev/null 2>&1
          # CI disposable secrets only. Production requires controlled host ACLs.
          chmod 0644 "$secrets/postgres_password" "$secrets/throttle_hmac" \
            "$secrets/cert.pem" "$secrets/key.pem"
          cat > "$secrets/pilot.env" <<EOF
          POSTGRES_DB=twm
          POSTGRES_USER=twm
          TWM_PUBLIC_ORIGIN=https://localhost:8443
          TWM_HTTPS_BIND_ADDRESS=127.0.0.1
          TWM_HTTPS_PORT=8443
          TWM_PG_PASSWORD_FILE=$secrets/postgres_password
          TWM_THROTTLE_SECRET_FILE=$secrets/throttle_hmac
          TWM_TLS_CERT_FILE=$secrets/cert.pem
          TWM_TLS_KEY_FILE=$secrets/key.pem
          EOF
          args=(--env-file "$secrets/pilot.env" -f deploy/compose.pilot.yml -p twm-pilot-ci)
          trap 'docker compose "${args[@]}" down -v --remove-orphans || true' EXIT
          docker compose "${args[@]}" config --quiet
          docker compose "${args[@]}" up -d --build
          ready=0
          for i in {1..40}; do
            if curl --fail --silent --cacert "$secrets/cert.pem" \
              https://localhost:8443/api/v1/health/ready | grep -q '"ready"'; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            docker compose "${args[@]}" ps
            docker compose "${args[@]}" logs --tail=70
            exit 1
          fi
          curl --fail --silent --show-error --cacert "$secrets/cert.pem" \
            -D "$secrets/headers" -o "$secrets/health.json" \
            https://localhost:8443/api/v1/health/ready
          grep -qi '^strict-transport-security:' "$secrets/headers"
          grep -qi '^cache-control: no-store' "$secrets/headers"
          grep -q '"database":"ok"' "$secrets/health.json"
          echo "Isolated pilot image build, real TLS handshake and DB readiness PASS"
