
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, migration and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: twm_test
          POSTGRES_USER: twm
          POSTGRES_PASSWORD: twm_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twm -d twm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TWM_APP_ENV: test
      TWM_DATABASE_URL: postgresql+psycopg://twm:twm_test_password@localhost:5432/twm_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: backend
        run: ruff check .
      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Backend tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend - typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: TypeScript check
        working-directory: frontend
        run: npm run check
      - name: Production build
        working-directory: frontend
        run: npm run build

  e2e:
    name: Browser E2E - Chromium and synthetic data
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: twm_e2e
          POSTGRES_USER: twm_e2e
          POSTGRES_PASSWORD: disposable_ci_database_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twm_e2e -d twm_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TWM_APP_ENV: test
      TWM_DATABASE_URL: postgresql+psycopg://twm_e2e:disposable_ci_database_only@127.0.0.1:5432/twm_e2e
      E2E_BASE_URL: http://127.0.0.1:5173
      E2E_ALLOW_SEED: "1"
      E2E_ADMIN_USERNAME: e2e_admin
      VITE_API_PROXY_TARGET: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install API
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Install browser test runner
        working-directory: frontend
        run: npm install && npx playwright install --with-deps chromium
      - name: Generate one-run admin and reviewer passwords
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets
          for name in ("E2E_ADMIN_PASSWORD", "E2E_ACTOR_PASSWORD"):
              token = secrets.token_urlsafe(32)
              print("::add-mask::" + token)
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
                  out.write(name + "=" + token + "\n")
          PY
      - name: Apply isolated test migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Create ephemeral admin account
        working-directory: backend
        env:
          TWM_ADMIN_USERNAME: e2e_admin
          TWM_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
        run: python -m app.identity.bootstrap_admin
      - name: Start API
        working-directory: backend
        shell: bash
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend-e2e.log 2>&1 &
          for i in {1..45}; do
            curl --silent --fail http://127.0.0.1:8000/api/v1/health/ready && exit 0
            sleep 2
          done
          cat ../backend-e2e.log
          exit 1
      - name: Run browser acceptance scenarios
        working-directory: frontend
        env:
          E2E_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
          E2E_ACTOR_PASSWORD: ${{ env.E2E_ACTOR_PASSWORD }}
        run: npm run test:e2e
      - name: Upload screenshots, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend-e2e.log
